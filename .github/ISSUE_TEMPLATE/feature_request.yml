name: Feature request / 改进建议
description: Describe the workflow or problem you want to improve.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 当前问题
      description: Describe a concrete user scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 期望方案
      description: Expected behavior and alternatives considered.
    validations:
      required: true
